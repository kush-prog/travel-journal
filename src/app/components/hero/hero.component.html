<section class="hero" id="top" aria-labelledby="hero-title">
  <div class="hero-intro">
    <p class="eyebrow">A journal for the curious</p>
    <h1 id="hero-title">The Roam<br />Report</h1>
    <svg class="hero-doodle" viewBox="0 0 120 70" aria-hidden="true">
      <path d="M13 49c12-7 13-27 27-29 10-1 13 19 22 19 12 0 9-28 22-29 9 0 9 20 20 23" />
      <path d="M19 57c21-12 23-2 38-12 12-8 18 7 30 2 8-4 8-13 20-16" />
      <circle cx="43" cy="13" r="4" />
      <path d="M59 56c6-8 13-7 18-1m-34-2 5 7m41-4 7 5" />
    </svg>
    <p class="hero-description">
      Stories and photographs of long walks, wrong turns, and everyday discoveries.
    </p>
    <div class="hero-details" aria-label="Travel notes">
      <span>Currently in</span>
      <span class="detail-dot" aria-hidden="true"></span>
      <span>Dalat, Ethiopia</span>
      <span class="detail-dot" aria-hidden="true"></span>
      <span>14° 24′ N</span>
    </div>
  </div>

  <div class="hero-feature">
    <img
      class="hero-landscape"
      [src]="featuredImage"
      [alt]="featuredImageAlt"
      fetchpriority="high"
    />
    <article class="featured-card">
      <img [src]="storyImage" [alt]="storyImageAlt" />
      <div class="featured-copy">
        <p class="eyebrow">Featured article</p>
        <h2>Wild Camping Along Tasmania’s East Coast</h2>
        <a href="#stories">Read the story <span aria-hidden="true">↗</span></a>
      </div>
    </article>
    <p class="hero-caption">A little farther from the familiar.</p>
  </div>
</section>
