<header class="site-header">
  <a class="brand" routerLink="/" fragment="top" aria-label="The Roam Report home">
    <span class="brand-mark" aria-hidden="true">R</span>
    <span>The Roam Report</span>
  </a>

  <button
    class="menu-toggle"
    type="button"
    [attr.aria-expanded]="menuOpen"
    aria-controls="primary-navigation"
    [attr.aria-label]="menuOpen ? 'Close navigation menu' : 'Open navigation menu'"
    (click)="toggleMenu()"
  >
    <span aria-hidden="true">{{ menuOpen ? '−' : '+' }}</span>
  </button>

  <nav
    id="primary-navigation"
    class="site-navigation"
    [class.site-navigation--open]="menuOpen"
    aria-label="Main navigation"
  >
    <a routerLink="/" fragment="top" (click)="closeMenu()">Home</a>
    <a routerLink="/" fragment="stories" (click)="closeMenu()">Articles</a>
    <a routerLink="/" fragment="about" (click)="closeMenu()">About</a>
    <a routerLink="/contact" (click)="closeMenu()">Contact</a>
  </nav>
</header>
